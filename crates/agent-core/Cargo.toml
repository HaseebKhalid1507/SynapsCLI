[package]
name = "synaps-core"
version = "0.3.7"
edition = "2021"
rust-version = "1.80"
description = "Foundation types, config, session, auth, protocol — leaf crate for agent-runtime"
license = "Apache-2.0"

[lib]
name = "agent_core"
path = "src/lib.rs"

[dependencies]
serde              = { version = "1.0", features = ["derive"] }
serde_json         = "1.0"
tokio              = { version = "1.0", features = ["full"] }
toml               = "0.8"
bytes              = "1"
tracing            = "0.1"
tracing-appender   = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest            = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
uuid               = { version = "1.0", features = ["v4"] }
base64             = "0.22"
rand               = "0.9"
sha2               = "0.10"
chrono             = { version = "0.4", features = ["serde"] }
thiserror          = "1.0"
dirs               = "5"
fs4                = "0.13"
axum               = { version = "0.7", features = ["ws"] }
url                = "2"
urlencoding        = "2"

[dev-dependencies]
serial_test = "3.4.0"
tempfile    = "3"
