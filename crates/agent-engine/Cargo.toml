[package]
name = "synaps-engine"
version.workspace = true
edition = "2021"
rust-version = "1.88"
description = "Runtime engine — streaming, tools, MCP, skills, extensions, sidecar"
license = "Apache-2.0"

[lib]
name = "agent_engine"
path = "src/lib.rs"

[features]
# The model's direct command tools: `bash`/`powershell` and the interactive
# `shell_*` PTY tools. ON by default so a normal build is unchanged.
# `--no-default-features` compiles `bash`/`powershell` out and never registers
# `shell_*`. It removes those tools only and is NOT a sandbox: `write`/`edit`
# (which can change shell rc files, `mcp.json`, plugin manifests and watcher
# configs), watcher `wake_if` (`sh -c`), extensions, MCP servers and plugin
# commands still start processes. `ShellStartTool` and friends stay exported,
# so an embedder can still register them.
default = ["command-exec"]
command-exec = []
# Test-support surface: offline Runtime construction for headless harnesses.
# Never enabled in production builds; enabled by synaps-tui's `testing` feature.
testing = []

[dependencies]
agent-core = { workspace = true }

# Async runtime + utilities
tokio              = { version = "1.0", features = ["full"] }
tokio-util         = "0.7"
tokio-stream       = "0.1"
futures            = "0.3"
async-trait        = "0.1.89"

# HTTP / SSE / networking
reqwest            = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots", "rustls-tls-native-roots"] }
bytes              = "1"
memchr             = "2"
flate2             = "1"

# Serialisation
serde              = { version = "1.0", features = ["derive", "rc"] }
serde_json         = { version = "1.0", features = ["float_roundtrip"] }
toml               = "0.8"

# Tracing / logging
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender   = "0.2"

# Identifiers / time
uuid               = { version = "1.0", features = ["v4"] }
chrono             = { version = "0.4", features = ["serde"] }

# Error handling
thiserror          = "1.0"
anyhow             = "1.0"

# Regex / text
regex              = "1"

# Crypto / auth
sha2               = "0.10"
hmac               = "0.12"
rand               = "0.9"
base64             = "0.22"
image              = { version = "=0.24.9", default-features = false, features = ["png", "jpeg"] }

# URL handling
url                = "2"
urlencoding        = "2"

# File / system
dirs               = "5"
fs4                = "0.13"
notify             = "6.1"
globset            = "0.4"
zeroize            = "1.8.2"
tempfile           = "3"

# Signals / process (Unix only — see [target.'cfg(unix)'.dependencies])

# PTY / shell
portable-pty       = "0.9"

# Terminal (skills/keybinds use crossterm)
crossterm          = { version = "0.29", features = ["event-stream"] }

# Server
axum               = { version = "0.7", features = ["ws"] }
tower              = "0.4"
tower-http         = { version = "0.5", features = ["cors"] }
tokio-tungstenite  = "0.21"

# Misc
arc-swap           = "1"

[target.'cfg(unix)'.dependencies]
libc        = "0.2"
signal-hook = { version = "0.3", features = ["iterator"] }

# Windows-native daemon: named-pipe security (owner-only DACL, server
# identity check), the spawn ready event, the reload lock hand-off and
# process liveness. Same major as tokio's, so no second copy is built.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
serial_test = "3.4.0"
tempfile    = "3"
tokio       = { version = "1.0", features = ["full", "test-util"] }
# Self dev-dependency (same pattern as synaps-tui): turns the `testing`
# feature on for every test target via feature unification, so integration
# tests in tests/ see the harness seams without extra cargo flags.
# default-features = false so `--no-default-features` (hardened) test builds
# are not silently re-unified back to `default` = command-exec by this edge.
synaps-engine = { path = ".", features = ["testing"], default-features = false }
