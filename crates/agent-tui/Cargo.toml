[package]
name = "synaps-tui"
version = "0.9.0"
edition = "2021"
rust-version = "1.80"
description = "Terminal UI layer — ratatui, crossterm, syntect, tachyonfx"
license = "Apache-2.0"

[lib]
name = "agent_tui"
path = "src/lib.rs"

[dependencies]
agent-core   = { path = "../agent-core", version = "0.9.0", package = "synaps-core" }
agent-engine = { path = "../agent-engine", version = "0.9.0", package = "synaps-engine" }

# Async runtime + utilities
tokio        = { version = "1.0", features = ["full"] }
tokio-util   = "0.7"
futures      = "0.3"
async-trait  = "0.1.89"

# Serialisation
serde        = { version = "1.0", features = ["derive", "rc"] }
serde_json   = "1.0"

# Tracing
tracing      = "0.1"

# Time / ids
chrono       = { version = "0.4", features = ["serde"] }
uuid         = { version = "1.0", features = ["v4"] }

# Error handling
thiserror    = "1.0"
anyhow       = "1.0"
reqwest      = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots", "rustls-tls-native-roots"] }

# TUI render crates
ratatui       = "0.30"
crossterm     = { version = "0.29", features = ["event-stream"] }
tachyonfx     = { version = "0.25", features = ["sendable"] }
syntect       = { version = "5", default-features = false, features = ["default-themes", "default-syntaxes", "regex-fancy"] }
arc-swap      = "1"
unicode-width = "0.2.0"
arboard       = "3"
# Input editing state machine (hybrid plan §4): maintained fork of tui-textarea.
# TextArea is never rendered — it owns editing semantics only; the existing
# soft-wrap render pipeline consumes flat (text, cursor) via compat accessors.
tui-textarea-2 = { version = "0.12", default-features = false, features = ["crossterm"] }

# Signal handling (tui/signals.rs) — see [target.'cfg(unix)'.dependencies]

# Render-thread synchronisation (tui/render_thread.rs)
parking_lot  = "0.12"

[build-dependencies]
# C1: curated syntect dump (`build.rs`). `parsing` implies dump-create + dump-load.
syntect    = { version = "5", default-features = false, features = ["default-syntaxes", "dump-create", "regex-fancy"] }
serde_json = "1.0"

[features]
# Headless TUI test harness (tui::testing). Pulls in the engine's offline
# Runtime constructor. Never enabled in production builds.
testing = ["agent-engine/testing"]

[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.3", features = ["iterator"] }

[target.'cfg(all(unix, not(target_env = "musl")))'.dev-dependencies]
# tests/highlight_mem.rs: same allocator as the synaps binary so the C1/C2
# syntect heap numbers come from jemalloc's own accounting, not glibc's
# never-returned free lists.
tikv-jemallocator = { version = "0.6", features = ["background_threads"] }

[dev-dependencies]
serial_test = "3.4.0"
# P5 spike: escape-level render verification — parses the ANSI byte stream a
# real CrosstermBackend emits so tests can assert on the *parsed* screen.
vt100       = "0.16"
tempfile    = "3"
sha2        = "0.10"
# Self dev-dependency: turns the `testing` feature on for every test target
# (unit, integration, doc) via feature unification, so `#[cfg(test)]` code
# and tests/ both see tui::testing without extra flags.
synaps-tui  = { path = ".", features = ["testing"] }
