name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

# Runner images are pinned: `ubuntu-latest` moves to a new Ubuntu on its own
# schedule, and a CI break should come from a commit, not a calendar date.
#
# Every cargo invocation passes `--locked`: CI must build the dependency
# graph that's committed, never a freshly resolved one.
#
# rust-cache saves only from main/dev pushes, so PR runs restore a warm
# cache without churning the repo's cache quota.
#
# No `cargo fmt --check` job: the tree doesn't pass it today (164 files).
# Add one in the same PR that formats the tree.

jobs:
  # `--workspace`: without it only the root `synaps` package is selected, so
  # the member crates' test modules and `crates/*/tests` were never linted
  # here (they were only linted as dependency libs).
  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # The suite was previously never run in CI, so a failing test could sit on a
  # green PR indefinitely — `infinite_tool_loop_stops_at_exact_round_budget`
  # did exactly that after graceful round-renewal landed. Serial-marked tests
  # mutate process-global state (HOME, env, audit spool), so this must NOT be
  # sharded or the `#[serial]` guarantees stop holding.
  #
  # It runs under a seeded, realistic HOME (Claude Code identity line,
  # memory.backend = axel, context_management.mode = auto, a dummy
  # auth.json) instead of the runner's empty one, which could never see a
  # test reading the developer's real ~/.synaps-cli. Any test that writes
  # into that HOME fails the job. The whole workspace, so a new test binary
  # needs no list entry. Same suite as before: the cost is seconds (seeding
  # and two fingerprints). See scripts/dirty-home.sh. `--no-fail-fast` so
  # the write check runs over every binary even after a failure.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' }}
      - run: bash scripts/dirty-home.sh --workspace --locked --no-fail-fast

  feature-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' }}
      - run: cargo build --features testing --locked

  # The `--no-default-features` build (no bash/shell_* tools). No other job
  # compiles it, so its cfg gates rot silently without this: build, lint and
  # run the whole suite in that configuration. The registry test is the
  # direct check that the gated tools are really absent. It is named exactly
  # and goes through cargo-test-nonzero.sh, so the step goes red if that one
  # test is renamed or compiled out (a module filter would still match ~15
  # ungated registry tests and stay green).
  hardened-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' }}
      - run: cargo build --no-default-features --locked
      - run: cargo clippy --workspace --all-targets --no-default-features --locked -- -D warnings
      - run: cargo test --workspace --no-default-features --locked --no-fail-fast
      - run: bash scripts/cargo-test-nonzero.sh -p synaps-engine --no-default-features --locked --lib tools::registry::tests::hardened_build_excludes_command_exec_tools -- --exact

  # Every other job runs on Linux, so macOS-only breakage (e.g. `libc::mode_t`
  # is u16 there, u32 on Linux) first surfaced in the v0.10.0 release build.
  # This compiles what a release compiles — workspace libs + bins — on a Mac.
  macos-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' }}
      - run: cargo check --workspace --locked
      # The macOS Git resolution (`git_program`: PATH, the /usr/bin/git
      # shim, developer directories) only takes its real branch here.
      - run: cargo test --locked -p synaps-core --lib git_program

  # Nothing else compiles for Windows, so Windows-only breakage landed
  # unnoticed: `dev` stopped building there when the Unix-socket daemon
  # merged (d49f3c6b), and test targets rotted behind Unix-only APIs.
  # Clippy builds and lints every target (libs, bins, tests) in both
  # feature sets, as the Linux jobs do. The daemon suites drive the
  # Windows-native daemon (named pipes, detached spawn, reload lock
  # hand-off) with real processes; the TUI's unit tests run in full. The
  # rest of the suite isn't run here yet: dozens of tests outside the daemon
  # and the TUI still fail on Windows.
  #
  # autocrlf off so the checkout is byte-identical to Linux (fixtures and
  # `include_str!` goldens are LF).
  windows:
    runs-on: windows-2025
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --no-default-features --locked -- -D warnings
      - run: cargo test --locked --no-fail-fast --test "daemon_*"
      - run: cargo test --locked --no-fail-fast -p synaps-tui --lib

  # The Axel memory sidecar is its own workspace (its own Cargo.lock and
  # dependency graph), so nothing above builds it. Its `axel` dependency is
  # a public git repo pinned by rev; no credentials needed.
  sidecar:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sidecars/axel-memory-service
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sidecars/axel-memory-service
          save-if: ${{ github.event_name == 'push' }}
      - run: cargo build --locked
      - run: cargo test --locked

  # The sidecar's macOS-only code (`private_path` volfs, unsafe libc calls)
  # is compiled by nothing else. Check it, tests included.
  sidecar-macos-check:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: sidecars/axel-memory-service
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sidecars/axel-memory-service
          save-if: ${{ github.event_name == 'push' }}
      - run: cargo check --all-targets --locked

  ignore-ratchet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ignore-ratchet.sh

  loc-ratchet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/loc-ratchet.sh
