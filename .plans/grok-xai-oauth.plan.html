    {
      "id": "objective",
      "heading": "Objective",
      "type": "prose",
      "md": "Add xAI/Grok OAuth while replacing scattered string-based OAuth dispatch with a typed registry that remains coherent at seven or more providers. Make the credential broker the **mandatory credential boundary for every OAuth token and API key**: runtimes request usable credentials from the broker and never read provider secrets directly. Deliver `xai-auth/grok-4.5` login, refresh, brokered credential resolution, and verified runtime routing without changing Anthropic or OpenAI Codex behavior."
    },
    {
      "id": "scope",
      "heading": "Scope and non-goals",
      "type": "prose",
      "md": "**In scope:** typed provider identity; provider descriptors/behavior; Anthropic and Codex migration; xAI OIDC login/refresh; a mandatory broker path for all OAuth and API-key providers; safe static-secret handling; one verified xAI model/wire path; headless harness. **Deferred:** every model from the reference package, xAI custom tools, CLI-only Composer/Build routing, and automatic `~/.grok/auth.json` import. Those require separate evidence and slices. Direct runtime reads of `auth.json`, provider-key config, or provider environment variables are explicitly out of the target architecture."
    },
    {
      "id": "architecture",
      "heading": "Target architecture",
      "type": "prose",
      "md": "Separate three dimensions that are currently conflated: **credential ownership** (the broker is the sole owner/resolver of OAuth and API-key secrets), **authentication policy** (OAuth refresh, static key, delegated/ephemeral credential, or broker-proxied request), and **wire protocol** (Anthropic Messages, OpenAI Chat Completions, OpenAI Responses, Codex backend). A single typed provider registry is the source for login UI, refresh behavior, storage key, broker capability, and runtime auth requirements. Runtime model descriptors reference a broker credential contract and wire protocol rather than reading secrets or growing one route variant per vendor."
    },
    {
      "id": "broker-requirement",
      "heading": "Mandatory credential-broker requirement",
      "type": "criteria",
      "md": "**All provider credentials flow through the credential broker, including local execution.** OAuth refresh tokens and API keys are owned only by the broker process/storage boundary. The runtime receives the minimum usable credential for the shortest practical lifetime and never opens `auth.json`, reads provider API-key config, or consults provider key environment variables. For OAuth, the broker refreshes and returns access token + expiry only. For static API keys, the implementation must choose and document one safe contract before migration: **preferred** broker-side request proxy/signing so the raw key never leaves the broker; an access-key vending mode is acceptable only for same-host compatibility and must be explicitly classified as secret disclosure, disabled for remote clients by default, authenticated, audited, and scheduled for removal. Failure to reach a safe static-key contract blocks the migration gate.",
      "risk": "security-sensitive"
    },
    {
      "id": "provider-contract",
      "heading": "Provider contract and invariants",
      "type": "prose",
      "md": "Introduce `OAuthProviderId` and an `OAuthProvider` contract/descriptor. Canonical IDs are `anthropic`, `openai-codex`, and `xai-auth`; CLI alias `claude` resolves only at the input boundary. Registry startup/tests reject duplicate IDs and invalid cross-references. Credentials retain common token fields plus validated provider-owned metadata rather than accumulating optional vendor fields. Unknown auth-file entries remain round-trippable. Refresh persistence remains atomic and merge-based."
    },
    {
      "id": "xai-protocol",
      "heading": "Confirmed xAI protocol",
      "type": "prose",
      "md": "Use issuer `https://auth.x.ai`, discovery `https://auth.x.ai/.well-known/openid-configuration`, public native client ID `b1a00492-073a-47ea-816f-4c329264a828`, scopes `openid profile email offline_access grok-cli:access api:access`, redirect `http://127.0.0.1:56121/callback`, PKCE S256, random `state` and OIDC `nonce`. Discovery endpoints must be HTTPS and hosted by `x.ai` or a subdomain before code/refresh-token POSTs. Persist under `xai-auth`; preserve an old refresh token if refresh omits a replacement."
    },
    {
      "id": "dependency-graph",
      "heading": "Dependency graph",
      "type": "prose",
      "md": "`typed IDs + registry contract` \u2192 `broker credential protocol + static-key safety decision` \u2192 `Anthropic/Codex registry migration` \u2192 (`xAI auth slice`, `auth-policy/runtime route contract`) \u2192 `all-provider broker migration` \u2192 `xAI request path` \u2192 `CLI integration` \u2192 `headless E2E harness` \u2192 `full verification + adversarial review`. Storage and callback hardening support provider implementations, but only the broker may expose credentials to runtimes. Runtime protocol selection depends on the route contract, not on login UI."
    },
    {
      "id": "convergence-policy",
      "heading": "Convergence and execution policy",
      "type": "prose",
      "md": "**Mode: holdout** because OAuth handles long-lived secrets and affects remote broker boundaries. Fixed before implementation: threshold **0.85**; axis weights **correctness 0.30, security 0.30, architecture/type invariants 0.20, readability 0.10, performance 0.10**; maximum fix iterations **2**; maximum total calls **10**. Coder subagents work in dedicated worktrees with an explicit agent/system prompt and inherit the session model unless an override is recorded. Independent oracle authors do not see builder tests before freezing adversarial properties."
    },
