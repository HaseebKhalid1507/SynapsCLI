    {
      "id": "objective",
      "heading": "Objective",
      "type": "prose",
      "md": "Add xAI/Grok OAuth while replacing scattered string-based OAuth dispatch with a typed registry that remains coherent at seven or more providers. Deliver `xai-auth/grok-4.5` login, refresh, local/remote credential resolution, broker vending, and verified runtime routing without changing Anthropic or OpenAI Codex behavior."
    },
    {
      "id": "scope",
      "heading": "Scope and non-goals",
      "type": "prose",
      "md": "**In scope:** typed provider identity; provider descriptors/behavior; Anthropic and Codex migration; xAI OIDC login/refresh; broker and runtime auth integration; one verified xAI model/wire path; headless harness. **Deferred:** every model from the reference package, xAI custom tools, CLI-only Composer/Build routing, and automatic `~/.grok/auth.json` import. Those require separate evidence and slices."
    },
    {
      "id": "architecture",
      "heading": "Target architecture",
      "type": "prose",
      "md": "Separate three dimensions that are currently conflated: **OAuth behavior** (`login`, `refresh`, credential metadata), **authentication policy** (API key, local OAuth, remote broker), and **wire protocol** (Anthropic Messages, OpenAI Chat Completions, OpenAI Responses, Codex backend). A single typed OAuth registry is the source for login UI, refresh dispatch, storage key, and broker capability. Runtime model descriptors reference an auth policy and wire protocol rather than growing one route variant per vendor."
    },
    {
      "id": "provider-contract",
      "heading": "Provider contract and invariants",
      "type": "prose",
      "md": "Introduce `OAuthProviderId` and an `OAuthProvider` contract/descriptor. Canonical IDs are `anthropic`, `openai-codex`, and `xai-auth`; CLI alias `claude` resolves only at the input boundary. Registry startup/tests reject duplicate IDs and invalid cross-references. Credentials retain common token fields plus validated provider-owned metadata rather than accumulating optional vendor fields. Unknown auth-file entries remain round-trippable. Refresh persistence remains atomic and merge-based."
    },
    {
      "id": "xai-protocol",
      "heading": "Confirmed xAI protocol",
      "type": "prose",
      "md": "Use issuer `https://auth.x.ai`, discovery `https://auth.x.ai/.well-known/openid-configuration`, public native client ID `b1a00492-073a-47ea-816f-4c329264a828`, scopes `openid profile email offline_access grok-cli:access api:access`, redirect `http://127.0.0.1:56121/callback`, PKCE S256, random `state` and OIDC `nonce`. Discovery endpoints must be HTTPS and hosted by `x.ai` or a subdomain before code/refresh-token POSTs. Persist under `xai-auth`; preserve an old refresh token if refresh omits a replacement."
    },
    {
      "id": "dependency-graph",
      "heading": "Dependency graph",
      "type": "prose",
      "md": "`typed IDs + registry contract` \u2192 `Anthropic/Codex registry migration` \u2192 (`xAI auth slice`, `auth-policy/runtime route contract`) \u2192 `xAI request path` \u2192 `CLI/broker integration` \u2192 `headless E2E harness` \u2192 `full verification + adversarial review`. Storage and callback hardening support all provider slices. Runtime protocol selection depends on the route contract, not on login UI."
    },
    {
      "id": "convergence-policy",
      "heading": "Convergence and execution policy",
      "type": "prose",
      "md": "**Mode: holdout** because OAuth handles long-lived secrets and affects remote broker boundaries. Fixed before implementation: threshold **0.85**; axis weights **correctness 0.30, security 0.30, architecture/type invariants 0.20, readability 0.10, performance 0.10**; maximum fix iterations **2**; maximum total calls **10**. Coder subagents work in dedicated worktrees with an explicit agent/system prompt and inherit the session model unless an override is recorded. Independent oracle authors do not see builder tests before freezing adversarial properties."
    },
