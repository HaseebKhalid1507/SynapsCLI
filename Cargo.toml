[package]
name = "synaps"
version = "0.3.4"
edition = "2021"
authors = ["Haseeb Khalid <haseebkhalid1507@gmail.com>"]
license = "Apache-2.0"
description = "Terminal-native AI agent runtime — parallel orchestration, reactive subagents, MCP, autonomous supervision"
repository = "https://github.com/HaseebKhalid1507/SynapsCLI"
homepage = "https://github.com/HaseebKhalid1507/SynapsCLI"
keywords = ["ai", "agent", "terminal", "cli", "rust"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/", "docs/", "tests/fixtures/", "examples/"]
rust-version = "1.80"

[dependencies]
agent-core = { path = "crates/agent-core", version = "0.3.4", package = "synaps-core" }
agent-engine = { path = "crates/agent-engine", version = "0.3.4", package = "synaps-engine" }
agent-tui = { path = "crates/agent-tui", version = "0.3.4", package = "synaps-tui" }
arc-swap = "1"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
bytes = "1"
memchr = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
uuid = { version = "1.0", features = ["v4"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1.89"
futures = "0.3"
tokio-stream = "0.1"
tokio-util = "0.7"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
sha2 = "0.10"
rand = "0.9"
base64 = "0.22"
urlencoding = "2"
url = "2"
fs4 = "0.13"
toml = "0.8"
notify = "6.1"
globset = "0.4"
signal-hook = { version = "0.3", features = ["iterator"] }

# Server deps
axum = { version = "0.7", features = ["ws"] }
unicode-width = "0.2.0"

# Shell / PTY deps
portable-pty = "0.9"
regex = "1"

# Hidden deps
dirs = "5"
tempfile = "3"
clap_complete = "4.5.67"

[dev-dependencies]
serial_test = "3.4.0"
tempfile = "3"

[lib]
name = "synaps_cli"
path = "src/lib.rs"

[[bin]]
name = "synaps"
path = "src/main.rs"

[[bin]]
name = "hidden"
path = "src/bin/hidden/main.rs"


[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Dev profile: line-tables-only keeps backtraces useful while cutting
# debuginfo codegen/link time substantially (REVIEW.md A1 quick win).
[profile.dev]
debug = "line-tables-only"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[package.metadata.deb]
maintainer = "Haseeb Khalid <haseebkhalid1507@gmail.com>"
copyright = "2026, Haseeb Khalid"
license-file = ["LICENSE", "0"]
extended-description = "Terminal-native AI agent runtime. Parallel orchestration, reactive subagents, MCP client, autonomous watcher daemon."
section = "utils"
priority = "optional"
assets = [
    ["target/release/synaps", "usr/bin/", "755"],
]

[workspace]
members = ["crates/agent-core", "crates/agent-engine", "crates/agent-tui"]
resolver = "2"
