[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Ship gzip tarballs (not the default .tar.xz): the shell installer extracts
# with `tar`, and xz/xz-utils is absent on minimal systems (slim containers,
# bare CI) — gzip is universal, so the installer works everywhere. (#134)
unix-archive = ".tar.gz"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Allow CI to proceed even if generated files differ (we have custom jobs)
allow-dirty = ["ci"]

# macos-14 runner images are retired on 2026-11-02 (actions/runner-images#13518);
# dist 0.31 still picks them for Apple Silicon.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
